name: 'Mutation'
on:
  schedule:
  - cron: '0 6 * * 1'
  workflow_dispatch: {}
permissions:
  contents: 'write'
jobs:
  check_yaml_consistency:
    name: 'Check YAML consistency'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v4'
    - id: 'step-1'
      name: 'Execute script'
      run: 'rm ''.github/workflows/mutation.yaml'' && ''.github/workflows/mutation.main.kts'''
    - id: 'step-2'
      name: 'Consistency check'
      run: 'git diff --exit-code ''.github/workflows/mutation.yaml'''
  mutation:
    runs-on: 'ubuntu-latest'
    needs:
    - 'check_yaml_consistency'
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@v4'
    - id: 'step-1'
      name: 'Setup JDK'
      uses: 'actions/setup-java@v5'
      with:
        java-version: '21'
        distribution: 'temurin'
    - id: 'step-2'
      name: 'Setup Gradle'
      uses: 'gradle/actions/setup-gradle@v4'
    - id: 'step-3'
      name: 'Mutation'
      run: './gradlew pitest --continue'
    - id: 'step-4'
      name: 'Test strength'
      run: 'set -o pipefail; kotlin tools/mutation-strength.main.kts --badge mutation.json | tee -a "$GITHUB_STEP_SUMMARY"'
      if: 'always()'
    - id: 'step-5'
      name: 'Publish badge'
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
      run: |-
        test -f mutation.json || exit 0
        dir="$(mktemp -d)"
        cp mutation.json "$dir/"
        cd "$dir"
        git init -q -b badges
        git add mutation.json
        git -c user.name='github-actions[bot]' \
          -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -q -m 'Mutation test strength'
        git push -q -f "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" badges
      if: 'always()'
    - id: 'step-6'
      name: 'Upload reports'
      uses: 'actions/upload-artifact@v4'
      with:
        name: 'pitest-reports'
        path: '**/build/reports/pitest'
      if: 'always()'
