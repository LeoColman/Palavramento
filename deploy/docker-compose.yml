# Palavramento no ritalee (Docker Swarm + caddy-docker-proxy). Deploy: deploy/publish.sh (ADR 0013).
#   server     - Ktor na porta 8080, publicado pelo Caddy em https://${APP_HOST} (REST e WebSocket)
#   postgres   - contas, rodadas e resultados
#   prometheus - raspa GET /metrics do server (bearer token), só na rede interna, nunca pelo Caddy
#   grafana    - painéis sobre o Prometheus, publicado pelo Caddy em https://${GRAFANA_HOST}
#
# O Swarm ignora depends_on: os serviços reiniciam até as dependências responderem.

services:
  server:
    image: palavramento-server:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/palavramento
      DATABASE_USER: palavramento
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
    deploy:
      # Uma réplica só: o estado das rodadas em andamento vive em memória (ADR 0007).
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { memory: 1536M }
      labels:
        caddy: "${APP_HOST}"
        caddy.reverse_proxy: "{{upstreams 8080}}"
    networks: [default, caddy]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: palavramento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: palavramento
    volumes:
      - /root/manual-stacks/palavramento/pgdata:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 10s }
      resources:
        limits: { memory: 1G }
    networks: [default]

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1y
    volumes:
      # Config e dashboard ficam versionados no código enviado pelo publish.sh (ADR 0013).
      # Token de autenticação da raspagem: nunca no git, escrito pelo deploy.sh a partir de
      # METRICS_TOKEN (.env), dono uid 65534 (usuário "nobody" desta imagem), chmod 600.
      - /root/manual-stacks/palavramento/metrics_token:/etc/prometheus/metrics_token:ro
      - /root/manual-stacks/palavramento/prometheus-data:/prometheus
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { memory: 512M }
      # Sem labels do Caddy de propósito: o Prometheus não é publicado, só a rede default o alcança.
    networks: [default]

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}/
    volumes:
      - /root/manual-stacks/palavramento/grafana-data:/var/lib/grafana
    configs:
      - source: grafana-datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana-dashboards
        target: /etc/grafana/provisioning/dashboards/palavramento.yml
      - source: grafana-dashboard-palavramento
        target: /var/lib/grafana/dashboards/palavramento.json
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 5s }
      resources:
        limits: { memory: 256M }
      labels:
        caddy: "${GRAFANA_HOST}"
        caddy.reverse_proxy: "{{upstreams 3000}}"
    networks: [default, caddy]

  backup:
    image: b3vis/borgmatic:2.0.2-fix
    environment:
      # Senha do repositório Borg e senha do Postgres, que o borgmatic.yaml usa no pg_dump.
      BORG_PASSPHRASE: ${BORG_PASSPHRASE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # 4h da manhã, fora do horário de jogo.
      BACKUP_CRON: "0 4 * * *"
    volumes:
      # Diretório cru do Postgres, somente leitura: rede de segurança do pg_dump (ADR 0021).
      - /root/manual-stacks/palavramento/pgdata:/data:ro
      # Volume externo com a chave SSH do servidor, compartilhado com os outros stacks do ritalee.
      - ssh:/root/.ssh/
    configs:
      - source: borgmatic
        target: /etc/borgmatic.d/config.yaml
    deploy:
      replicas: 1
      restart_policy: { condition: any, delay: 30s }
      resources:
        limits: { memory: 512M }
    networks: [default]

networks:
  default:
  caddy:
    external: true

volumes:
  ssh:
    external: true

# Configuração vai como `config` do Swarm, não como bind mount: é assim que os outros stacks do
# ritalee fazem, o conteúdo fica no raft junto com o serviço e o container não depende de caminho
# do host. Config do Swarm é imutável, então o nome carrega o hash do conteúdo (CONFIG_VERSION,
# calculado pelo deploy.sh): conteúdo novo, config novo, serviço atualizado; conteúdo igual, nada
# muda. Assim ninguém precisa criar config à mão nem inventar sufixo -v2, -v3.
configs:
  prometheus:
    name: palavramento-prometheus-${CONFIG_VERSION}
    file: ./prometheus.yml
  grafana-datasource:
    name: palavramento-grafana-datasource-${CONFIG_VERSION}
    file: ./grafana/provisioning/datasources/prometheus.yml
  grafana-dashboards:
    name: palavramento-grafana-dashboards-${CONFIG_VERSION}
    file: ./grafana/provisioning/dashboards/palavramento.yml
  grafana-dashboard-palavramento:
    name: palavramento-grafana-dashboard-${CONFIG_VERSION}
    file: ./grafana/dashboards/palavramento.json
  borgmatic:
    name: palavramento-borgmatic-${CONFIG_VERSION}
    file: ./borgmatic.yaml
