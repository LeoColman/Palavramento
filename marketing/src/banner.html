<!DOCTYPE html>
<!--
  Source for the Google Ads image assets in marketing/ads/.
  Rendered by marketing/src/render.sh, which drives headless Chrome at the exact
  pixel size Google asks for, so nothing is ever resampled.

  Query string: ?c=<creative id> for an ad image (see CREATIVES below: each one fixes its own
  aspect ratio, copy and visual), or ?f=<icon|feature|backdrop> for the Play Store icon, the
  Play Store feature graphic and the 16:9 video backdrop.

  Colors are the app's own palette (app/src/main/kotlin/.../ui/theme/PalavramentoColors.kt),
  so an ad and the screen it leads to look like the same product.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Palavramento - banners</title>
<style>
  :root {
    --background: #0B1B34;
    --surface: #122A4D;
    --surface-variant: #1B3760;
    --tile: #E08A2B;
    --tile-text: #1A1005;
    --tile-value: #4A2E05;
    --text-primary: #F5F0E6;
    --text-secondary: #B9C2D0;
    --highlight: #E0B84A;
    --accepted: #4CAF7D;
    --match-accent: #3E7BD6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #000; }

  body {
    font-family: 'Inter Display', 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
  }

  .canvas {
    position: relative;
    overflow: hidden;
    background: var(--background);
    color: var(--text-primary);
    display: flex;
    flex-shrink: 0;
  }

  /* One warm pool of light behind the board, so the flat navy does not read as dead space. */
  .canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(60% 55% at var(--glow-x, 50%) var(--glow-y, 42%), rgba(224, 138, 43, 0.22), transparent 70%),
      radial-gradient(90% 70% at 15% 100%, rgba(62, 123, 214, 0.18), transparent 70%);
  }

  .canvas > * { position: relative; }

  /* ---------- wordmark ---------- */
  .wordmark {
    display: flex;
    align-items: center;
    gap: 0.62em;
    font-size: var(--wordmark-size, 26px);
  }
  .wordmark .glyph {
    width: 1.92em;
    height: 1.92em;
    border-radius: 0.42em;
    background: var(--tile);
    color: var(--tile-text);
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 1.15em;
    line-height: 1;
    box-shadow: 0 0.12em 0 rgba(0, 0, 0, 0.32);
  }
  .wordmark .name {
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: 0.86em;
    color: var(--text-primary);
  }

  /* ---------- copy ---------- */
  .headline {
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.022em;
    font-size: var(--headline-size, 76px);
  }
  .headline em { font-style: normal; color: var(--highlight); }

  .subline {
    color: var(--text-secondary);
    font-weight: 500;
    line-height: 1.35;
    font-size: var(--subline-size, 30px);
  }

  .badges { display: flex; gap: 0.6em; flex-wrap: wrap; font-size: var(--badge-size, 22px); }
  .badge {
    border: 1.5px solid rgba(185, 194, 208, 0.38);
    border-radius: 999px;
    padding: 0.5em 1.05em;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  /* ---------- board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--board-gap, 14px);
    width: var(--board-size, 560px);
    aspect-ratio: 1;
  }
  .tile {
    position: relative;
    border-radius: 14%;
    background: var(--tile);
    color: var(--tile-text);
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: calc(var(--board-size, 560px) / 4 * 0.46);
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.28);
  }
  .tile .value {
    position: absolute;
    top: 7%;
    left: 9%;
    font-size: 0.34em;
    font-weight: 700;
    color: var(--tile-value);
  }
  .tile.lit {
    background: var(--highlight);
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.28);
  }
  /* A two-letter tile ("A/P") is set smaller, the way the app sets it. */
  .tile.pair { font-size: calc(var(--board-size, 560px) / 4 * 0.28); }

  .board-wrap { position: relative; display: grid; }
  .board-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* The accepted-word toast the match screen shows, reused as proof of the core loop. */
  .toast {
    align-self: center;
    background: var(--accepted);
    color: #06230F;
    font-weight: 800;
    border-radius: 999px;
    padding: 0.5em 1.2em;
    font-size: var(--toast-size, 30px);
    letter-spacing: 0.01em;
  }

  /* ---------- phone ---------- */
  .phone {
    border-radius: var(--phone-radius, 44px);
    border: var(--phone-bezel, 10px) solid #060F1F;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    background: #060F1F;
    flex-shrink: 0;
  }
  .phone img { display: block; width: 100%; height: auto; }

  /* ---------- formats ---------- */
  body.square .canvas {
    width: 1200px; height: 1200px;
    flex-direction: column; align-items: center; justify-content: space-between;
    padding: 76px 64px 72px;
    --wordmark-size: 30px;
    --headline-size: 82px;
    --subline-size: 32px;
    --badge-size: 24px;
    --board-size: 620px;
    --board-gap: 16px;
    --toast-size: 32px;
  }
  body.square .stack { display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center; }
  body.square .subline, body.tall .subline { text-align: center; }
  /* A capture rises from the bottom edge and is cut by it (see the layout code). */
  body.square .phone { width: 500px; --phone-radius: 40px; --phone-bezel: 9px; }

  body.wide .canvas {
    width: 1200px; height: 628px;
    flex-direction: row; align-items: center;
    padding: 0 60px;
    gap: 52px;
    --glow-x: 76%;
    --glow-y: 50%;
    --wordmark-size: 24px;
    --headline-size: 58px;
    --subline-size: 24px;
    --badge-size: 19px;
    --board-size: 400px;
    --board-gap: 11px;
  }
  body.wide .left { display: flex; flex-direction: column; gap: 26px; flex: 1; }
  /* The screenshot variant needs an explicit width: the raw capture is 1080px wide and would
     otherwise push the copy off the canvas. 248px keeps the whole phone inside 628px of height. */
  body.wide .phone { width: 248px; --phone-radius: 26px; --phone-bezel: 6px; }

  body.tall .canvas {
    width: 1200px; height: 1500px;
    flex-direction: column; align-items: center; justify-content: space-between;
    padding: 96px 72px 88px;
    --glow-y: 55%;
    --wordmark-size: 32px;
    --headline-size: 88px;
    --subline-size: 34px;
    --badge-size: 25px;
    --board-size: 720px;
    --board-gap: 18px;
    --phone-radius: 56px;
    --phone-bezel: 12px;
  }
  body.tall .stack { display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
  body.tall .phone { width: 620px; }
  .phone.rising { margin-top: 40px; }

  /* Play Store icon: 512x512, full bleed, no transparency, the launcher's own orange tile. */
  body.icon .canvas {
    width: 512px; height: 512px;
    background: var(--tile);
    align-items: center; justify-content: center;
    padding: 0;
  }
  body.icon .canvas::before { display: none; }
  body.icon .monogram { width: 512px; height: 512px; display: block; }

  /* Play Store feature graphic: 1024x500, safe margins because the edges get cropped. */
  body.feature .canvas {
    width: 1024px; height: 500px;
    flex-direction: row; align-items: center; justify-content: center;
    padding: 0 84px;
    gap: 56px;
    --glow-x: 72%;
    --wordmark-size: 26px;
    --headline-size: 52px;
    --subline-size: 23px;
    --board-size: 320px;
    --board-gap: 9px;
  }
  body.feature .left { display: flex; flex-direction: column; gap: 22px; flex: 1; }

  /* Backdrop for the 16:9 video cut: the app is portrait, so the landscape frame is a
     composition, not a crop. The slot on the right is where render-video.sh overlays the
     recording, at exactly these coordinates. */
  body.backdrop .canvas {
    width: 1920px; height: 1080px;
    flex-direction: row; align-items: center;
    padding: 0 120px;
    gap: 90px;
    --glow-x: 74%;
    --wordmark-size: 34px;
    --headline-size: 92px;
    --subline-size: 40px;
    --badge-size: 28px;
  }
  body.backdrop .left { display: flex; flex-direction: column; gap: 40px; flex: 1; }
  body.backdrop .slot {
    width: 428px; height: 960px;
    border-radius: 44px;
    background: #060F1F;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<script>
const params = new URLSearchParams(location.search)

// Letter values are the game's own (domain/src/main/resources/letter-values.json, version 2):
// A E S 1, I N O R 2, C D L M T U 3, H P 4, B G 5, F V Z 6, J Q X 8, K W Y 10. A word scores
// the sum of its tiles, which the real captures confirm ("runo +9" is 2+3+2+2). An ad that
// scores a word differently from the game is an ad the first round contradicts.

// PALAVRA over tiles 0,1,2,3,7,6,5 (eight-way adjacency, no tile reused): 4+1+3+1+6+2+1 = 18.
const PALAVRA = {
  tiles: [
    ['P', 4], ['A', 1], ['L', 3], ['A', 1],
    ['M', 3], ['A', 1], ['R', 2], ['V', 6],
    ['E', 1], ['S', 1], ['O', 2], ['T', 3],
    ['I', 2], ['N', 2], ['C', 3], ['D', 3],
  ],
  path: [0, 1, 2, 3, 7, 6, 5],
}

// The "Uma ou outra" theme: one tile plays as either letter and is worth 20, as it is in the
// game (the real captures show "20 A/P", "20 I/S"). PATO over tiles 5,1,2,6, with the A/P tile
// as P: 20+1+3+2 = 26.
const UMA_OU_OUTRA = {
  tiles: [
    ['S', 1], ['A', 1], ['T', 3], ['E', 1],
    ['M', 3], ['A/P', 20], ['O', 2], ['R', 2],
    ['C', 3], ['U', 3], ['N', 2], ['I', 2],
    ['L', 3], ['E', 1], ['D', 3], ['O', 2],
  ],
  path: [5, 1, 2, 6],
}

// The tiles carry no accent and no cedilla; the game matches "maçã" on M-A-C-A all the same.
// That is the claim "Português de verdade" makes, so the board shows it: M,A,C,A over tiles
// 4,5,0,1 is 3+1+3+1 = 8.
const MACA = {
  tiles: [
    ['C', 3], ['A', 1], ['S', 1], ['O', 2],
    ['M', 3], ['A', 1], ['R', 2], ['T', 3],
    ['E', 1], ['N', 2], ['I', 2], ['D', 3],
    ['L', 3], ['U', 3], ['O', 2], ['S', 1],
  ],
  path: [4, 5, 0, 1],
}

// Real captures, straight from the store screenshots, so an ad never shows a different app from
// the one the listing shows. (A copy of one of them used to live here and went stale.)
const SHOTS = {
  partida: '../screenshots/3-partida.png',
  resultados: '../screenshots/4-resultados.png',
  placar: '../screenshots/5-placar.png',
}

const BADGES = ['Sem cadastro', 'Sem compras', 'Código aberto']

// Every image the campaign gets: Google takes up to 20, across the three ratios, and learns which
// combinations work, so each one pairs a different argument from google-ads.md with a different
// visual. Only claims that stay true: an in-app ad banner is planned after 1.0.0
// (marketing/play-store.md), so "no ads" would turn false the day it ships, in creatives already
// approved and running.
//
//   format: wide 1200x628 (1.91:1), square 1200x1200 (1:1), tall 1200x1500 (4:5)
//   visual: 'palavra' | 'uma-ou-outra' | 'maca' (drawn boards) or a key of SHOTS (real capture)
//   extra:  'badges' | a toast text | undefined
const TEMAS = 'Temas que mudam<br>as <em>regras</em>'
const TEMAS_SUB = 'Nesta rodada, uma peça vale A ou P.'
const CREATIVES = {
  'wide-dois-minutos-grade': ['wide', 'palavra', 'Dois minutos.<br>Uma grade <em>só</em>.',
    'Você e a sala inteira no mesmo 4x4, ao mesmo tempo.', 'badges'],
  'wide-dois-minutos-partida': ['wide', 'partida', 'Dois minutos.<br>Uma grade <em>só</em>.',
    'Você e a sala inteira no mesmo 4x4, ao mesmo tempo.', 'badges'],
  'wide-placar': ['wide', 'placar', 'Placar <em>ao vivo</em><br>toda rodada',
    'Acabou o tempo, o placar sai na hora.', 'badges'],
  'wide-temas': ['wide', 'uma-ou-outra', TEMAS, TEMAS_SUB],
  'wide-gratis': ['wide', 'palavra', '<em>Grátis</em> do<br>começo ao fim',
    'Caça-palavras multijogador em português.', 'badges'],
  'wide-quantas-partida': ['wide', 'partida', 'Quantas você acha<br>em <em>2 minutos</em>?',
    'Trace com o dedo, some pontos, suba no placar.'],
  'wide-que-eles-temas': ['wide', 'uma-ou-outra', 'Ache mais palavras<br><em>que eles</em>',
    'Grade 4x4, 2 minutos, placar ao vivo.', 'badges'],

  'square-mesma-grade': ['square', 'palavra', 'Todos na <em>mesma</em> grade',
    'Caça-palavras multijogador em português.<br>Rodada de 2 minutos, placar na hora.', 'palavra +18'],
  'square-placar': ['square', 'placar', 'Placar <em>ao vivo</em>',
    'Toda rodada, quem achou mais sobe.'],
  'square-temas': ['square', 'uma-ou-outra', 'Temas que mudam as <em>regras</em>', TEMAS_SUB, 'pato +26'],
  'square-que-eles-partida': ['square', 'partida', 'Ache mais palavras <em>que eles</em>',
    'Grade 4x4, 2 minutos, placar ao vivo.'],
  'square-gratis': ['square', 'palavra', '<em>Grátis.</em> Sem cadastro.',
    'Sem compras, sem assinatura, código aberto.', 'palavra +18'],
  'square-portugues': ['square', 'maca', 'Português <em>de verdade</em>',
    'Acento e cedilha como você espera, com dicionário pt-BR.', 'maçã +8'],
  'square-resultados': ['square', 'resultados', 'Veja o que <em>ficou para trás</em>',
    'No fim da rodada, todas as palavras que a grade tinha.'],

  'tall-que-eles-grade': ['tall', 'palavra', 'Ache mais<br>palavras <em>que eles</em>',
    'Grade 4x4, 2 minutos, placar ao vivo.', 'badges'],
  'tall-que-eles-partida': ['tall', 'partida', 'Ache mais<br>palavras <em>que eles</em>',
    'Grade 4x4, 2 minutos, placar ao vivo.'],
  'tall-placar': ['tall', 'placar', 'Placar<br><em>ao vivo</em>', 'Acabou o tempo, o placar sai na hora.'],
  'tall-resultados': ['tall', 'resultados', 'Veja o que<br><em>ficou para trás</em>',
    'No fim da rodada, todas as palavras que a grade tinha.'],
  'tall-temas': ['tall', 'uma-ou-outra', TEMAS, TEMAS_SUB, 'pato +26'],
  'tall-gratis': ['tall', 'palavra', '<em>Grátis</em> do<br>começo ao fim',
    'Sem compras, sem assinatura, código aberto.', 'badges'],
}

const creative = CREATIVES[params.get('c')]
const format = creative ? creative[0] : (params.get('f') || 'square')
document.body.className = format

function board(def) {
  const lit = new Set(def.path)
  const wrap = document.createElement('div')
  wrap.className = 'board-wrap'
  const grid = document.createElement('div')
  grid.className = 'board'
  def.tiles.forEach(([letter, value], i) => {
    const tile = document.createElement('div')
    tile.className = 'tile' + (lit.has(i) ? ' lit' : '') + (letter.length > 1 ? ' pair' : '')
    tile.innerHTML = `<span class="value">${value}</span>${letter}`
    grid.appendChild(tile)
  })
  wrap.appendChild(grid)

  // The traced path, drawn in the grid's own percentage space so it scales with --board-size.
  const cell = 100 / 4
  const centre = i => [((i % 4) + 0.5) * cell, (Math.floor(i / 4) + 0.5) * cell]
  const points = def.path.map(i => centre(i).join(',')).join(' ')
  const [x0, y0] = centre(def.path[0])
  wrap.insertAdjacentHTML('beforeend', `
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <polyline points="${points}" fill="none" stroke="#1A1005" stroke-opacity="0.55"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${x0}" cy="${y0}" r="1.5" fill="#1A1005" fill-opacity="0.55"/>
    </svg>`)
  return wrap
}

function wordmark() {
  const el = document.createElement('div')
  el.className = 'wordmark'
  el.innerHTML = '<span class="glyph">P</span><span class="name">Palavramento</span>'
  return el
}

function el(tag, cls, html) {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (html) node.innerHTML = html
  return node
}

function phone(src) {
  const box = el('div', 'phone')
  const img = document.createElement('img')
  img.src = src
  box.appendChild(img)
  return box
}

function badges() {
  const box = el('div', 'badges')
  BADGES.forEach(text => box.appendChild(el('span', 'badge', text)))
  return box
}

function visual(key) {
  if (key === 'palavra') return board(PALAVRA)
  if (key === 'uma-ou-outra') return board(UMA_OU_OUTRA)
  if (key === 'maca') return board(MACA)
  return phone(SHOTS[key])
}

const canvas = el('div', 'canvas')
document.body.appendChild(canvas)

if (format === 'backdrop') {
  const left = el('div', 'left')
  left.appendChild(wordmark())
  left.appendChild(el('h1', 'headline', 'Dois minutos.<br>Uma grade <em>só</em>.'))
  left.appendChild(el('p', 'subline', 'Caça-palavras multijogador em português.'))
  left.appendChild(badges())
  canvas.appendChild(left)
  canvas.appendChild(el('div', 'slot'))
} else if (format === 'icon') {
  // The launcher icon itself: ic_launcher_foreground.xml's path over ic_launcher_background's
  // orange, rendered at the full 108x108 viewport so the Play Store icon and the installed
  // icon are the same drawing.
  canvas.appendChild(el('div', 'monogram', `
    <svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" width="512" height="512">
      <rect width="108" height="108" fill="#E08A2B"/>
      <path fill="#1A1005" fill-rule="evenodd"
            d="M40,24 L78,24 L78,54 L58,54 L58,84 L40,84 Z M50,32 L68,32 L68,46 L50,46 Z"/>
    </svg>`))
} else if (format === 'feature') {
  const left = el('div', 'left')
  left.appendChild(wordmark())
  left.appendChild(el('h1', 'headline', 'Caça-palavras<br>multijogador'))
  left.appendChild(el('p', 'subline', 'Grade 4x4, dois minutos, todo mundo junto.'))
  canvas.appendChild(left)
  canvas.appendChild(board(PALAVRA))
} else {
  const [, key, headline, subline, extra] = creative
  const isShot = key in SHOTS
  const toast = extra && extra !== 'badges' ? el('div', 'toast', extra) : null

  if (format === 'wide') {
    const left = el('div', 'left')
    left.appendChild(wordmark())
    left.appendChild(el('h1', 'headline', headline))
    left.appendChild(el('p', 'subline', subline))
    if (extra === 'badges') left.appendChild(badges())
    if (toast) left.appendChild(toast)
    canvas.appendChild(left)
    canvas.appendChild(visual(key))
  } else {
    const stack = el('div', 'stack')
    stack.appendChild(wordmark())
    stack.appendChild(el('h1', 'headline', headline))
    canvas.appendChild(stack)
    if (isShot) {
      // The phone rises from the bottom edge and is cut by it: at these ratios a whole phone
      // would be too small to read, and the top of the screen is where the game is. The subline
      // joins the title block, so the phone gets room instead of butting against the text.
      stack.appendChild(el('p', 'subline', subline))
      const shot = visual(key)
      shot.classList.add('rising')
      canvas.appendChild(shot)
    } else {
      canvas.appendChild(visual(key))
      if (toast) canvas.appendChild(toast)
      canvas.appendChild(el('p', 'subline', subline))
      if (extra === 'badges') canvas.appendChild(badges())
    }
  }
}
</script>
</body>
</html>
